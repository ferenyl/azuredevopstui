[package]
name = "azuredevopstui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Terminal UI for your Azure DevOps pull requests, work items and sprint board"
repository = "https://github.com/ferenyl/azuredevopstui"
readme = "README.md"
keywords = ["azure-devops", "tui", "ratatui", "pull-requests", "work-items"]
categories = ["command-line-utilities"]
exclude = [".github", "projectdescription.md"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
html2text = "0.17.1"
keyring = "4.2.0"
open = "5.4.4"
ratatui = { version = "0.30.2", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
