name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List commits since previous release
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
            heading="## Changes since $previous"
          else
            range="$TAG"
            heading="## Changes"
          fi
          {
            # Drop a changes section from an earlier run so re-runs don't duplicate it.
            body=$(gh release view "$TAG" --json body --jq .body | awk '/^## Changes/ { exit } { print }')
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            fi
            echo "$heading"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like v1.2.3"
            exit 1
          fi
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG does not match version $cargo_version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          name="azuredevopstui-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/azuredevopstui" README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "azuredevopstui-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/azuredevopstui.exe", README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" --clobber

  publish:
    name: Publish to crates.io
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    name: Update AUR packages
    needs: build
    # Off until the repository variable AUR_ENABLED is "true".
    # pkgver cannot contain "-", so pre-releases are not packaged.
    if: ${{ vars.AUR_ENABLED == 'true' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli openssh pacman-contrib namcap

      - uses: actions/checkout@v7

      - name: Bump PKGBUILDs
        run: |
          git config --global --add safe.directory '*'
          useradd -m builder
          chown -R builder .
          su builder -c "aur/bump.sh ${TAG#v}"

      - name: Lint PKGBUILDs
        run: namcap aur/*/PKGBUILD || true

      - uses: actions/upload-artifact@v4
        with:
          name: aur-${{ github.event.release.tag_name }}
          path: |
            aur/*/PKGBUILD
            aur/*/.SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; download the aur-$TAG artifact and push it to the AUR by hand"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          for dir in aur/*/; do
            package=$(basename "$dir")
            git clone "ssh://aur@aur.archlinux.org/$package.git" "$RUNNER_TEMP/$package"
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "$RUNNER_TEMP/$package/"
            git -C "$RUNNER_TEMP/$package" add PKGBUILD .SRCINFO
            if git -C "$RUNNER_TEMP/$package" diff --cached --quiet; then
              echo "$package is already up to date"
              continue
            fi
            git -C "$RUNNER_TEMP/$package" \
              -c user.name=Ferenyl -c user.email=ahlback.johan@gmail.com \
              commit -m "Update to ${TAG#v}"
            git -C "$RUNNER_TEMP/$package" push
          done

      - name: Open a PR with the bumped PKGBUILDs
        continue-on-error: true
        run: |
          branch="aur/$TAG"
          git checkout -b "$branch"
          git add aur/*/PKGBUILD aur/*/.SRCINFO
          if git diff --cached --quiet; then
            echo "aur/ is already up to date"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Update AUR packages to $TAG"
          if git push origin "$branch" &&
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "Update AUR packages to $TAG" \
              --body "Syncs the PKGBUILDs in aur/ with the packages pushed to the AUR for $TAG."; then
            exit 0
          fi
          echo "::warning::Could not open the PR (allow Actions to create pull requests in the repository settings); commit the aur-$TAG artifact files by hand"
          exit 1
